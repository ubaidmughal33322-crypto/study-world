function createSubjects(){

let container =
document.getElementById("subjects");

container.innerHTML = "";


subjects.forEach(function(subject,index){

let subjectBox =
document.createElement("div");

subjectBox.className="subject";


let title =
document.createElement("h2");

title.innerText=subject.name;

subjectBox.appendChild(title);


subject.chapters.forEach(function(chapter,chapterIndex){

let chapterBox =
document.createElement("div");

chapterBox.className="chapter";


let heading =
document.createElement("h3");

heading.innerText=chapter;

chapterBox.appendChild(heading);


let button =
document.createElement("button");

button.className="openBtn";

button.innerText="Open Chapter";

button.onclick=function(){

let content =
chapterBox.querySelector(".chapterContent");

if(content.style.display==="block"){

content.style.display="none";

button.innerText="Open Chapter";

}

else{

content.style.display="block";

button.innerText="Close Chapter";

}

};


chapterBox.appendChild(button);


let content =
document.createElement("div");

content.className="chapterContent";


content.innerHTML=`

<div class="box">

<h4>📖 Lesson / Concepts</h4>

<p>
${chapter} ke important concepts,
definitions aur explanations yahan
study material ke liye add kiye ja sakte hain.
</p>

</div>


<div class="box">

<h4>❓ Short Questions</h4>

<p>
Is chapter ke important short questions
aur answers yahan add honge.
</p>

</div>


<div class="box">

<h4>📝 Long Questions</h4>

<p>
Is chapter ke important long questions
aur detailed answers yahan add honge.
</p>

</div>


<div class="box">

<h4>🔘 MCQs</h4>

<p>
Is chapter ke important MCQs
yahan add honge.
</p>

</div>


<div class="box">

<h4>✍️ Exercise</h4>

<p>
Is chapter ki exercise aur practice
questions yahan add honge.
</p>

</div>


<div class="box">

<h4>🧮 Practice</h4>

<p>
Chapter-wise practice material
yahan add hoga.
</p>

</div>

`;


chapterBox.appendChild(content);

subjectBox.appendChild(chapterBox);

});


container.appendChild(subjectBox);

});

}


function searchChapters(){

let search =
document
.getElementById("searchInput")
.value
.toLowerCase();


let allSubjects =
document.querySelectorAll(".subject");


allSubjects.forEach(function(subject){

let text =
subject.innerText.toLowerCase();


if(text.includes(search)){

subject.style.display="block";

}

else{

subject.style.display="none";

}

});

}


createSubjects();
