function createSubjects(){

    let container =
        document.getElementById("subjects");

    container.innerHTML = "";


    subjects.forEach(function(subject){

        let subjectBox =
            document.createElement("div");

        subjectBox.className = "subject";


        let title =
            document.createElement("h2");

        title.innerText = subject.name;

        subjectBox.appendChild(title);


        subject.chapters.forEach(function(chapter){

            let chapterBox =
                document.createElement("div");

            chapterBox.className = "chapter";


            let heading =
                document.createElement("h3");

            heading.innerText = chapter;

            chapterBox.appendChild(heading);


            let button =
                document.createElement("button");

            button.className = "openBtn";

            button.innerText = "Open Chapter";


            let content =
                document.createElement("div");

            content.className = "content";


            content.innerHTML = `

                <div class="box">

                    <h4>📖 Lesson</h4>

                    <p>
                    ${chapter} ke complete lesson,
                    concepts aur explanation yahan add honge.
                    </p>

                </div>


                <div class="box">

                    <h4>❓ Short Questions</h4>

                    <p>
                    Is chapter ke important
                    short questions aur answers.
                    </p>

                </div>


                <div class="box">

                    <h4>📝 Long Questions</h4>

                    <p>
                    Is chapter ke important
                    long questions aur answers.
                    </p>

                </div>


                <div class="box">

                    <h4>🔘 MCQs</h4>

                    <p>
                    Is chapter ke important MCQs.
                    </p>

                </div>


                <div class="box">

                    <h4>✍️ Exercise</h4>

                    <p>
                    Is chapter ki textbook exercise
                    aur practice questions.
                    </p>

                </div>


                <div class="box">

                    <h4>🧮 Numericals / Practice</h4>

                    <p>
                    Jahan applicable ho,
                    numericals aur practice questions.
                    </p>

                </div>

            `;


            button.onclick = function(){

                if(content.style.display === "block"){

                    content.style.display = "none";

                    button.innerText = "Open Chapter";

                }

                else{

                    content.style.display = "block";

                    button.innerText = "Close Chapter";

                }

            };


            chapterBox.appendChild(button);

            chapterBox.appendChild(content);

            subjectBox.appendChild(chapterBox);

        });


        container.appendChild(subjectBox);

    });

}


function searchChapters(){

    let search =
        document
        .getElementById("searchInput")
        .value
        .toLowerCase();


    let allSubjects =
        document.querySelectorAll(".subject");


    allSubjects.forEach(function(subject){

        let text =
            subject.innerText.toLowerCase();


        if(text.includes(search)){

            subject.style.display = "block";

        }

        else{

            subject.style.display = "none";

        }

    });

}
