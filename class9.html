<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"

    <meta name="description"

    <title>Study World - Class 9</title>

        * {

            margin: 0;
            padding: 0;
        }

        body {

            background: #f4f8ff;
            color: #222;
            line-height: 1.6;

            text-align: center;

        }

        header h1 {

            margin-bottom: 10px;
        }

        header p {
            font-size: 18px;
        }

        nav {
            background: #123b70;
            padding: 12px;
            text-align: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin: 5px;
            padding: 10px 15px;
            display: inline-block;
            border-radius: 8px;
        }

        nav a:hover {
            background: #1d5fa7;
        }

        .container {
            max-width: 1100px;
            margin: auto;
            padding: 25px 15px;
        }

        .intro {
            background: white;
            padding: 25px;
            border-radius: 15px;
            margin-bottom: 25px;
            text-align: center;
            box-shadow: 0 3px 12px rgba(0,0,0,0.08);
        }

        .intro h2 {
            color: #174ea6;
            margin-bottom: 10px;
        }

        .subjects {
            display: grid;
            grid-template-columns:
            repeat(auto-fit, minmax(230px, 1fr));

            gap: 20px;
            margin-top: 20px;
        }

        .subject {
            background: white;
            padding: 22px;
            border-radius: 15px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.10);
            transition: 0.3s;
        }

        .subject:hover {
            transform: translateY(-5px);
        }

        .subject h3 {
            color: #174ea6;
            margin-bottom: 10px;
        }

        .subject p {
            margin-bottom: 15px;
        }

        .btn {
            display: inline-block;
            background: #174ea6;
            color: white;
            text-decoration: none;
            padding: 10px 16px;
            border-radius: 9px;
            border: none;
            cursor: pointer;
            font-size: 15px;
        }

        .btn:hover {
            background: #0d3b82;
        }

        .lesson-section {
            margin-top: 35px;
        }

            background: white;
            margin: 15px 0;

            border-radius: 15px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.08);
        }

        .lesson h3 {
            color: #174ea6;
            margin-bottom: 8px;
        }
