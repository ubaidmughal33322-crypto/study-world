/* ================= CHAPTER FUNCTION ================= */

function chapter(
title,
subject,
link=""
){

let button="";

if(link!=""){

button=`
<a
class="btn"
href="${link}"
target="_blank"
rel="noopener">
Open Notes
</a>
`;

}


return `

<details class="chapter">

<summary>
${title}
</summary>

<div class="content">


<div class="box">

<h3>📚 Notes</h3>

<p>
${subject} ${title} ke important notes
aur concepts yahan study karein.
</p>

${button}

</div>


<div class="box">

<h3>❓ Short Questions</h3>

<p>
Is chapter ke important short questions
prepare karein.
</p>

</div>


<div class="box">

<h3>📝 Long Questions</h3>

<p>
Important detailed questions aur answers
ki practice karein.
</p>

</div>


<div class="box">

<h3>🎯 MCQs</h3>

<p>
Chapter ke important multiple choice
questions ki practice karein.
</p>

</div>


<div class="box">

<h3>📖 Exercise</h3>

<p>
Textbook exercise aur practice questions
complete karein.
</p>

</div>


</div>

</details>

`;

}

/* ================= SEARCH ================= */

function searchStudy(){

let query=
document
.getElementById("search")
.value
.toLowerCase()
.trim();


document
.querySelectorAll(".subject")
.forEach(function(subject){

let subjectText=
subject.innerText.toLowerCase();

let subjectMatch=
subjectText.includes(query);

let count=0;


subject
.querySelectorAll(".chapter")
.forEach(function(ch){

let match=
subjectMatch ||
ch.innerText
.toLowerCase()
.includes(query);

if(match){

ch.style.display="block";
count++;

}else{

ch.style.display="none";

}

});


if(query==""){

subject.style.display="block";

}

else if(subjectMatch || count>0){

subject.style.display="block";

}

else{

subject.style.display="none";

}

});

}
